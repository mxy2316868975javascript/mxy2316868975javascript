      <text x="484" y="282" fill="#c9d1d9" font-size="10">03  AGENT ORCHESTRATION</text>
    </g>
    <g>
      <path d="M616 244V258H740V244" fill="none" stroke="#3fb950" stroke-width="2" />
      <text x="628" y="282" fill="#c9d1d9" font-size="11">04  ACCEPTANCE</text>
