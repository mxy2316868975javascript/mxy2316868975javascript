    <circle cx="1084" cy="39" r="5" fill="#3fb950" filter="url(#glow)" />
    <text x="1098" y="44" fill="#8b949e" font-size="12">CYCLE ACTIVE</text>

    <g fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.78">
      <path d="M188 152H202" />
