      <text x="78" y="135" fill="#58a6ff" font-size="11">01</text>
      <text x="78" y="166" fill="#f0f6fc" font-size="17" font-weight="700">IDEA</text>
    </g>
    <g>
      <rect x="202" y="112" width="124" height="80" rx="4" fill="#161b22" stroke="#58a6ff" />
      <text x="216" y="135" fill="#58a6ff" font-size="11">02</text>
      <text x="216" y="160" fill="#f0f6fc" font-size="12" font-weight="700">REQUIREMENT</text>
      <text x="216" y="177" fill="#f0f6fc" font-size="12" font-weight="700">DECOMPOSITION</text>
    </g>
    <g>
