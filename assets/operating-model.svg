<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Lemon's operational blueprint</title>
  <desc id="description">A workflow from idea through requirement decomposition, technical design, AI orchestration, validation, integration, deployment, and iteration. It highlights decomposition, technical judgment, agent orchestration, acceptance, and end-to-end ownership.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.62" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="#0d1117" />
  <rect width="1200" height="360" fill="url(#grid)" />
  <path d="M64 68H1136" stroke="#30363d" stroke-width="1" />

