<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title description">
  <title id="title">Lemon's operational blueprint</title>
  <desc id="description">A compact workflow from idea through requirement decomposition, technical design, AI orchestration, validation, integration, deployment, and iteration. It highlights decomposition, technical judgment, agent orchestration, acceptance, and end-to-end ownership.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.62" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="560" fill="#0d1117" />
  <rect width="640" height="560" fill="url(#grid)" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="32" y="40" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="1.5">HOW I WORK / OPERATING MODEL</text>
    <circle cx="530" cy="35" r="5" fill="#3fb950" filter="url(#glow)" />
    <text x="544" y="40" fill="#8b949e" font-size="11">ACTIVE</text>
    <path d="M32 60H608" stroke="#30363d" stroke-width="1" />

    <g fill="none" stroke="#58a6ff" stroke-width="2">
      <path d="M162 146H176" />
      <path d="M306 146H320" />
      <path d="M450 146H464" />
      <path d="M536 186V220" />
      <path d="M464 290H450" />
      <path d="M320 290H306" />
      <path d="M176 290H162" />
    </g>
    <g fill="#58a6ff">
      <path d="M172 141L176 146 172 151Z" />
      <path d="M316 141L320 146 316 151Z" />
      <path d="M460 141L464 146 460 151Z" />
      <path d="M531 216L536 220 541 216Z" />
      <path d="M454 285L450 290 454 295Z" />
      <path d="M310 285L306 290 310 295Z" />
      <path d="M166 285L162 290 166 295Z" />
    </g>

    <g>
      <rect x="32" y="104" width="130" height="84" rx="4" fill="#161b22" stroke="#58a6ff" />
      <text x="46" y="128" fill="#58a6ff" font-size="11">01</text><text x="46" y="163" fill="#f0f6fc" font-size="18" font-weight="700">IDEA</text>
      <rect x="176" y="104" width="130" height="84" rx="4" fill="#161b22" stroke="#58a6ff" />
      <text x="190" y="128" fill="#58a6ff" font-size="11">02</text><text x="190" y="157" fill="#f0f6fc" font-size="12" font-weight="700">REQUIREMENT</text><text x="190" y="174" fill="#f0f6fc" font-size="12" font-weight="700">DECOMPOSITION</text>
      <rect x="320" y="104" width="130" height="84" rx="4" fill="#161b22" stroke="#58a6ff" />
      <text x="334" y="128" fill="#58a6ff" font-size="11">03</text><text x="334" y="157" fill="#f0f6fc" font-size="12" font-weight="700">TECHNICAL</text><text x="334" y="174" fill="#f0f6fc" font-size="12" font-weight="700">DESIGN</text>
      <rect x="464" y="104" width="144" height="84" rx="4" fill="#161b22" stroke="#58a6ff" />
      <text x="478" y="128" fill="#58a6ff" font-size="11">04</text><text x="478" y="157" fill="#f0f6fc" font-size="12" font-weight="700">AI</text><text x="478" y="174" fill="#f0f6fc" font-size="12" font-weight="700">ORCHESTRATION</text>
    </g>

    <g>
      <rect x="464" y="248" width="144" height="84" rx="4" fill="#161b22" stroke="#3fb950" />
      <text x="478" y="272" fill="#3fb950" font-size="11">05</text><text x="478" y="307" fill="#f0f6fc" font-size="16" font-weight="700">VALIDATE</text>
      <rect x="320" y="248" width="130" height="84" rx="4" fill="#161b22" stroke="#3fb950" />
      <text x="334" y="272" fill="#3fb950" font-size="11">06</text><text x="334" y="307" fill="#f0f6fc" font-size="15" font-weight="700">INTEGRATE</text>
      <rect x="176" y="248" width="130" height="84" rx="4" fill="#161b22" stroke="#3fb950" />
      <text x="190" y="272" fill="#3fb950" font-size="11">07</text><text x="190" y="307" fill="#f0f6fc" font-size="16" font-weight="700">DEPLOY</text>
      <rect x="32" y="248" width="130" height="84" rx="4" fill="#161b22" stroke="#3fb950" />
      <text x="46" y="272" fill="#3fb950" font-size="11">08</text><text x="46" y="307" fill="#f0f6fc" font-size="16" font-weight="700">ITERATE</text>
    </g>

    <path d="M32 384H608" stroke="#30363d" stroke-width="1" />
    <text x="32" y="368" fill="#8b949e" font-size="11" letter-spacing="1.5">CORE CAPABILITIES</text>

    <g fill="#c9d1d9" font-size="12">
      <rect x="32" y="408" width="270" height="30" rx="3" fill="#161b22" stroke="#58a6ff" />
      <text x="46" y="428">01  DECOMPOSITION</text>
      <rect x="320" y="408" width="288" height="30" rx="3" fill="#161b22" stroke="#58a6ff" />
      <text x="334" y="428">02  TECHNICAL JUDGMENT</text>
      <rect x="32" y="450" width="270" height="30" rx="3" fill="#161b22" stroke="#58a6ff" />
      <text x="46" y="470">03  AGENT ORCHESTRATION</text>
      <rect x="320" y="450" width="288" height="30" rx="3" fill="#161b22" stroke="#3fb950" />
      <text x="334" y="470">04  ACCEPTANCE</text>
      <rect x="32" y="492" width="576" height="30" rx="3" fill="#161b22" stroke="#3fb950" />
      <text x="178" y="512">05  END-TO-END OWNERSHIP</text>
    </g>
  </g>
</svg>
