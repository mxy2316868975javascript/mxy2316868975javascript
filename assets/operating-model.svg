      <path d="M198 147L202 152 198 157Z" />
      <path d="M336 147L340 152 336 157Z" />
      <path d="M474 147L478 152 474 157Z" />
      <path d="M612 147L616 152 612 157Z" />
      <path d="M750 147L754 152 750 157Z" />
      <path d="M888 147L892 152 888 157Z" />
      <path d="M1026 147L1030 152 1026 157Z" />
    </g>

    <g>
