<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">AI workflow console for Lemon</title>
  <desc id="description">A dark technical banner showing connected AI workflow nodes and system status.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.65" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      :root {
        --cycle: 18s;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      }

      .stage-context,
      .stage-interface,
      .stage-workflow,
      .stage-ship,
      .packet-input,
      .packet-context,
      .packet-interface,
      .packet-output,
      .scan-line,
      .input-node,
      .workflow-node,
      .ship-node,
      .status-pulse {
        transform-box: fill-box;
        transform-origin: center;
      }

      .stage-context {
        animation: stage-context var(--cycle) var(--ease-out) infinite;
      }

      .stage-interface {
        animation: stage-interface var(--cycle) var(--ease-out) infinite;
      }

      .stage-workflow {
        animation: stage-workflow var(--cycle) var(--ease-out) infinite;
      }

      .stage-ship {
        animation: stage-ship var(--cycle) var(--ease-out) infinite;
      }

      .packet-input {
        animation: packet-input var(--cycle) linear infinite;
      }

      .packet-context {
        animation: packet-context var(--cycle) linear infinite;
      }

      .packet-interface {
        animation: packet-interface var(--cycle) linear infinite;
      }

      .packet-output {
        animation: packet-output var(--cycle) linear infinite;
      }

      .scan-line {
        animation: scan var(--cycle) linear infinite;
      }

      .input-node {
        animation: input-node var(--cycle) var(--ease-in-out) infinite;
      }

      .workflow-node {
        animation: workflow-node var(--cycle) var(--ease-in-out) infinite;
      }

      .ship-node {
        animation: ship-node var(--cycle) var(--ease-in-out) infinite;
      }

      .status-pulse {
        animation: status-breathe 3s var(--ease-in-out) infinite;
      }

      @keyframes stage-context {
        0%, 7%, 100% { opacity: 0.72; transform: scale(0.96); }
        12%, 24% { opacity: 1; transform: scale(1); }
        38% { opacity: 0.86; transform: scale(1); }
      }

      @keyframes stage-interface {
        0%, 11%, 100% { opacity: 0.72; transform: scale(0.96); }
        16%, 27% { opacity: 1; transform: scale(1); }
        40% { opacity: 0.86; transform: scale(1); }
      }

      @keyframes stage-workflow {
        0%, 20%, 100% { opacity: 0.72; transform: scale(0.97); }
        28%, 38% { opacity: 1; transform: scale(1); }
        52% { opacity: 0.88; transform: scale(1); }
      }

      @keyframes stage-ship {
        0%, 28%, 100% { opacity: 0.72; transform: scale(0.97); }
        34%, 42% { opacity: 1; transform: scale(1); }
        56% { opacity: 0.88; transform: scale(1); }
      }

      @keyframes packet-input {
        0%, 3%, 100% { opacity: 0; transform: translate(0, 0); }
        5% { opacity: 1; }
        10% { opacity: 1; transform: translate(116px, 0); }
        12%, 55% { opacity: 0; transform: translate(116px, 0); }
        59% { opacity: 1; transform: translate(0, 0); }
        64% { opacity: 1; transform: translate(116px, 0); }
        66% { opacity: 0; transform: translate(116px, 0); }
      }

      @keyframes packet-context {
        0%, 7%, 100% { opacity: 0; transform: translate(0, 0); }
        9% { opacity: 1; }
        13% { transform: translate(126px, 0); }
        16% { transform: translate(126px, 66px); }
        20% { opacity: 1; transform: translate(242px, 66px); }
        22%, 55% { opacity: 0; transform: translate(242px, 66px); }
        59% { opacity: 1; transform: translate(0, 0); }
        63% { transform: translate(126px, 0); }
        66% { transform: translate(126px, 66px); }
        70% { opacity: 1; transform: translate(242px, 66px); }
        72% { opacity: 0; transform: translate(242px, 66px); }
      }

      @keyframes packet-interface {
        0%, 12%, 100% { opacity: 0; transform: translate(0, 0); }
        14% { opacity: 1; }
        18% { transform: translate(86px, 0); }
        21% { transform: translate(86px, -66px); }
        25% { opacity: 1; transform: translate(242px, -66px); }
        27%, 55% { opacity: 0; transform: translate(242px, -66px); }
        63% { opacity: 1; transform: translate(0, 0); }
        67% { transform: translate(86px, 0); }
        70% { transform: translate(86px, -66px); }
        74% { opacity: 1; transform: translate(242px, -66px); }
        76% { opacity: 0; transform: translate(242px, -66px); }
      }

      @keyframes packet-output {
        0%, 28%, 100% { opacity: 0; transform: translate(0, 0); }
        30% { opacity: 1; }
        35% { opacity: 1; transform: translate(106px, 0); }
        37%, 76% { opacity: 0; transform: translate(106px, 0); }
        80% { opacity: 1; transform: translate(0, 0); }
        85% { opacity: 1; transform: translate(106px, 0); }
        87% { opacity: 0; transform: translate(106px, 0); }
      }

      @keyframes scan {
        0%, 4%, 100% { opacity: 0; transform: translateX(-4px); }
        7%, 29% { opacity: 0.42; }
        34% { opacity: 0; transform: translateX(1200px); }
        58% { opacity: 0; transform: translateX(-4px); }
        62%, 80% { opacity: 0.2; }
        86% { opacity: 0; transform: translateX(1200px); }
      }

      @keyframes input-node {
        0%, 5%, 100% { opacity: 0.64; transform: scale(1); }
        10% { opacity: 1; transform: scale(1.16); }
        15% { opacity: 0.76; transform: scale(1); }
        59% { opacity: 1; transform: scale(1.1); }
        66% { opacity: 0.7; transform: scale(1); }
      }

      @keyframes workflow-node {
        0%, 20%, 100% { opacity: 0.64; transform: scale(1); }
        26% { opacity: 1; transform: scale(1.16); }
        32% { opacity: 0.76; transform: scale(1); }
        70% { opacity: 1; transform: scale(1.1); }
        76% { opacity: 0.7; transform: scale(1); }
      }

      @keyframes ship-node {
        0%, 34%, 100% { opacity: 0.64; transform: scale(1); }
        39% { opacity: 1; transform: scale(1.16); }
        46% { opacity: 0.76; transform: scale(1); }
        85% { opacity: 1; transform: scale(1.1); }
        90% { opacity: 0.7; transform: scale(1); }
      }

      @keyframes status-breathe {
        0%, 100% { opacity: 0.72; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.13); }
      }

      @media (prefers-reduced-motion: reduce) {
        .stage-context,
        .stage-interface,
        .stage-workflow,
        .stage-ship,
        .packet-input,
        .packet-context,
        .packet-interface,
        .packet-output,
        .scan-line,
        .input-node,
        .workflow-node,
        .ship-node,
        .status-pulse {
          animation: none;
        }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#0d1117" />
  <rect width="1200" height="300" fill="url(#grid)" />
  <path d="M0 248 H1200" stroke="#30363d" stroke-width="1" />
  <rect class="scan-line" x="0" y="0" width="2" height="248" fill="#58a6ff" opacity="0" />

  <g fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.8">
    <path d="M650 84 H776 V150 H892" />
    <path d="M650 216 H736 V150 H892" />
    <path d="M930 150 H1056" />
  </g>
  <g fill="none" stroke="#3fb950" stroke-width="2" opacity="0.8">
    <path d="M534 150 H650" />
    <path d="M1056 150 H1136" />
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="64" y="68" fill="#8b949e" font-size="15" letter-spacing="2">AI SYSTEMS / FRONTEND ENGINEERING</text>
    <text x="64" y="126" fill="#f0f6fc" font-size="45" font-weight="700">LEMON</text>
    <text x="64" y="162" fill="#58a6ff" font-size="19">BUILDING RELIABLE PRODUCTS FROM COMPLEX WORKFLOWS</text>

    <rect x="64" y="204" width="190" height="28" fill="#161b22" stroke="#30363d" />
    <circle class="status-pulse" cx="82" cy="218" r="5" fill="#3fb950" filter="url(#glow)" />
    <text x="98" y="223" fill="#c9d1d9" font-size="13">SYSTEM ONLINE</text>
    <rect x="270" y="204" width="172" height="28" fill="#161b22" stroke="#30363d" />
    <text x="286" y="223" fill="#c9d1d9" font-size="13">MODE: BUILD</text>

    <g class="stage-context">
      <rect x="650" y="60" width="126" height="48" rx="4" fill="#161b22" stroke="#58a6ff" />
      <text x="669" y="89" fill="#c9d1d9" font-size="14">CONTEXT</text>
    </g>
    <g class="stage-interface">
      <rect x="650" y="192" width="126" height="48" rx="4" fill="#161b22" stroke="#58a6ff" />
      <text x="668" y="221" fill="#c9d1d9" font-size="14">INTERFACE</text>
    </g>
    <g class="stage-workflow">
      <rect x="892" y="124" width="138" height="52" rx="4" fill="#161b22" stroke="#3fb950" />
      <text x="917" y="155" fill="#f0f6fc" font-size="14">WORKFLOW</text>
    </g>
    <g class="stage-ship">
      <rect x="1056" y="124" width="80" height="52" rx="4" fill="#161b22" stroke="#3fb950" />
      <text x="1071" y="155" fill="#f0f6fc" font-size="14">SHIP</text>
    </g>
  </g>

  <g fill="#3fb950" filter="url(#glow)">
    <circle class="input-node" cx="650" cy="150" r="5" />
    <circle class="workflow-node" cx="892" cy="150" r="5" />
    <circle class="ship-node" cx="1056" cy="150" r="5" />
  </g>

  <g fill="#f0f6fc" filter="url(#glow)">
    <circle class="packet-input" cx="534" cy="150" r="4" />
    <circle class="packet-context" cx="650" cy="84" r="4" />
    <circle class="packet-interface" cx="650" cy="216" r="4" />
    <circle class="packet-output" cx="1030" cy="150" r="4" />
  </g>
</svg>
